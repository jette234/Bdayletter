<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthdayyyyyy my loveeeeee</title>

<style>

body {
    margin: 0;
    min-height: 100vh;
    background: #ffeaf3;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #555;
}

.page {
    max-width: 650px;
    margin: 0 auto;
    padding: 50px 20px;
}

h1 {
    color: #d85c91;
    font-size: 42px;
    margin-bottom: 10px;
}

.intro {
    font-size: 20px;
    margin-bottom: 30px;
}


/* BUTTON */

button,
.spotify-button {
    display: inline-block;
    background: #d85c91;
    color: white;
    border: none;
    padding: 15px 25px;
    border-radius: 15px;
    font-size: 18px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s;
}

button:hover,
.spotify-button:hover {
    transform: scale(1.05);
}

#message {
    margin-top: 25px;
    font-size: 20px;
    color: #d85c91;
}


/* LETTER */

.letter-section {
    margin-top: 70px;
}

.letter-section h2 {
    color: #d85c91;
}


/* WARPED ENVELOPE */

.envelope {
    position: relative;
    margin: 35px auto;
    width: 90%;
    max-width: 520px;
    padding: 35px 25px;
    background: #fff4e8;
    border-radius: 8px 15px 10px 12px;
    box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    transform: rotate(-1.5deg);
}


/* envelope flap */

.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 45%;
    background: #f9dfcf;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
}


/* PHOTO / LETTER */

.letter-image {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    height: auto;
    margin: 5px auto 0;
    border-radius: 5px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}


/* PLAYLIST */

.playlist {
    margin-top: 80px;
    padding-bottom: 60px;
}

.playlist h2 {
    color: #d85c91;
}

.playlist p {
    font-size: 18px;
    margin-bottom: 25px;
}

</style>
</head>


<body>

<div class="page">

    <h1>Happy Birthdayyyyy my loveeeeeee</h1>

    <p class="intro">
        I made you a little sth...
    </p>


   <p id=„message“>
Please ignore my questionable coding skills, i have no idea what im doinggggg, Hope u have an amazing dayy
</p>



    <!-- LETTER -->

    <div class="letter-section">

        <h2>💌 A little letter for you</h2>

        <div class="envelope">

            <!-- PUT YOUR LETTER IMAGE HERE -->
            <img
                src="IMG_0207.jpeg"
                alt=""
                class="letter-image"
            >

        </div>

    </div>



    <!-- SPOTIFY -->

    <div class="playlist">


        <p>
            💗💗💗
        </p>

        <a
            href="https://open.spotify.com/playlist/1xDzFCNen0Lntczamt25I8"
            target="_blank"
            class="spotify-button"
        >
            🎵 Open our playlist
        </a>

    </div>

</div>


</body>
</html>
